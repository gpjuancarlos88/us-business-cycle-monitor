indicators:
  - id: manufacturing_hours
    name: Manufacturing Weekly Hours
    short_name: Weekly Hours
    category: leading
    provider: fred
    series_id: AWHMAN
    frequency: monthly
    units: hours
    monthly_aggregation: last
    signal_transform: level
    direction: 1
    exact: true
    description: Average weekly hours of production and nonsupervisory employees in manufacturing.
    why_it_matters: Employers often adjust hours before changing headcount, so rising hours can signal strengthening production demand while falling hours can precede layoffs.

  - id: initial_claims
    name: Initial Jobless Claims
    short_name: Initial Claims
    category: leading
    provider: fred
    series_id: ICSA
    frequency: weekly
    units: persons
    monthly_aggregation: claims_4wk_last
    signal_transform: yoy_pct
    direction: -1
    exact: true
    description: New unemployment insurance claims; lower readings are generally stronger.
    why_it_matters: Claims react quickly when firms begin cutting labor. Sustained increases usually indicate weakening labor demand before the unemployment rate fully responds.

  - id: consumer_goods_orders
    name: Consumer Goods Orders
    short_name: Consumer Orders
    category: leading
    provider: fred
    series_id: ACOGNO
    frequency: monthly
    units: index_or_value
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 1
    exact: false
    proxy_note: Public proxy for the Conference Board consumer goods and materials orders component.
    description: Manufacturers' new orders for consumer goods.
    why_it_matters: New orders capture expected future production. When consumers and distributors order more goods, manufacturers typically need to increase output in coming months.

  - id: ism_new_orders
    name: ISM Manufacturing New Orders
    short_name: ISM New Orders
    category: leading
    provider: manual
    path: data/manual/ism_new_orders.csv
    frequency: monthly
    units: index
    monthly_aggregation: last
    signal_transform: ism_distance_50
    direction: 1
    exact: true
    description: ISM Manufacturing New Orders diffusion index; values above 50 indicate expansion.
    why_it_matters: New orders are one of the earliest signals in the manufacturing cycle. Readings above 50 indicate more firms reporting increases than decreases.

  - id: cap_goods_ex_air
    name: Nondefense Capital Goods ex Aircraft
    short_name: Cap Goods ex Air
    category: leading
    provider: fred
    series_id: NEWORDER
    frequency: monthly
    units: millions_usd
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 1
    exact: true
    description: Manufacturers' new orders for nondefense capital goods excluding aircraft.
    why_it_matters: This series is a widely used gauge of business equipment investment intentions. Weakening orders can indicate firms are becoming more cautious about future capital spending.

  - id: building_permits
    name: Building Permits
    short_name: Building Permits
    category: leading
    provider: fred
    series_id: PERMIT
    frequency: monthly
    units: thousands_saar
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 1
    exact: true
    description: New privately owned housing units authorized by building permits.
    why_it_matters: A permit is required before most residential construction begins, so permits provide an early read on future housing activity, construction employment, and related demand.

  - id: sp500
    name: S&P 500
    short_name: S&P 500
    category: leading
    provider: yahoo
    ticker: ^GSPC
    frequency: daily
    units: index
    monthly_aggregation: mean
    signal_transform: return_6m
    direction: 1
    exact: true
    description: S&P 500 price index, using Yahoo Finance for long practical history.
    why_it_matters: Equity prices incorporate investors' expectations for future earnings, growth, financial conditions, and risk, which makes the stock market forward-looking even though it is noisy.

  - id: financial_conditions
    name: Financial Conditions Leading Signal
    short_name: Financial Conditions
    category: leading
    provider: fred
    series_id: NFCI
    frequency: weekly
    units: index
    monthly_aggregation: mean
    signal_transform: level
    direction: -1
    exact: false
    proxy_note: Public proxy for the proprietary Conference Board Leading Credit Index.
    description: Chicago Fed National Financial Conditions Index; tighter conditions are economically negative.
    why_it_matters: Credit availability, leverage, funding costs, and market stress influence how easily households and businesses can borrow and invest. Tighter conditions can restrain future activity.

  - id: yield_spread
    name: 10Y Treasury minus Federal Funds Rate
    short_name: Yield Spread
    category: leading
    provider: fred
    series_id: T10YFF
    frequency: daily
    units: percentage_points
    monthly_aggregation: mean
    signal_transform: level
    direction: 1
    exact: true
    description: Ten-year Treasury constant maturity rate minus the effective federal funds rate.
    why_it_matters: The spread summarizes the slope between long-term and short-term rates. A compressed or inverted spread has historically been associated with restrictive monetary conditions and weaker future growth.

  - id: consumer_expectations
    name: Consumer Expectations Proxy
    short_name: Expectations
    category: leading
    provider: fred
    series_id: UMCSENT
    frequency: monthly
    units: index
    monthly_aggregation: last
    signal_transform: level
    direction: 1
    exact: false
    proxy_note: University of Michigan headline sentiment is used until an exact expectations blend is supplied.
    description: Public sentiment proxy for the Conference Board/Michigan expectations component.
    why_it_matters: Consumer expectations influence spending and saving decisions. A sustained deterioration can signal households are becoming more cautious about future economic conditions.

  - id: payrolls
    name: Nonfarm Payroll Employment
    short_name: Payrolls
    category: coincident
    provider: fred
    series_id: PAYEMS
    frequency: monthly
    units: thousands_persons
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 1
    exact: true
    description: Total nonfarm payroll employment.
    why_it_matters: Payrolls measure the number of jobs on employer payrolls and are one of the clearest gauges of current labor-market activity. Strong job creation generally accompanies economic expansion.

  - id: industrial_production
    name: Industrial Production
    short_name: Industrial Production
    category: coincident
    provider: fred
    series_id: INDPRO
    frequency: monthly
    units: index
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 1
    exact: true
    description: Federal Reserve industrial production index.
    why_it_matters: Industrial production tracks real output in manufacturing, mining, and utilities, providing a direct measure of current goods-producing activity.

  - id: real_income_ex_transfers
    name: Real Personal Income ex Transfers
    short_name: Real Income ex Transfers
    category: coincident
    provider: fred
    series_id: W875RX1
    frequency: monthly
    units: chained_billions_saar
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 1
    exact: true
    description: Real personal income excluding current transfer receipts.
    why_it_matters: This measure focuses on income generated by economic activity rather than government transfers. Rising real income supports household purchasing power and current demand.

  - id: real_manufacturing_trade_sales
    name: Real Manufacturing and Trade Sales
    short_name: Real Sales
    category: coincident
    provider: fred
    series_id: CMRMTSPL
    frequency: monthly
    units: chained_millions
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 1
    exact: true
    description: Real manufacturing and trade industries sales.
    why_it_matters: Real sales capture the volume of goods moving through manufacturers, wholesalers, and retailers, making them a broad measure of current business activity.

  - id: unemployment_duration
    name: Average Duration of Unemployment
    short_name: Unemployment Duration
    category: lagging
    subgroup: labor
    provider: fred
    series_id: UEMPMEAN
    frequency: monthly
    units: weeks
    monthly_aggregation: last
    signal_transform: level
    direction: -1
    exact: true
    description: Average number of weeks unemployed.
    why_it_matters: Unemployment duration usually rises after labor-market conditions have already weakened, which is why it is considered lagging. Persistent increases indicate workers are taking longer to find jobs.

  - id: inventory_sales_ratio
    name: Total Business Inventories to Sales Ratio
    short_name: Inventory / Sales
    category: lagging
    subgroup: credit_inventory
    provider: fred
    series_id: ISRATIO
    frequency: monthly
    units: ratio
    monthly_aggregation: last
    signal_transform: level
    direction: -1
    exact: true
    description: Total business inventories divided by sales.
    why_it_matters: A rising ratio can mean inventories are accumulating faster than sales, often because demand weakened unexpectedly. Firms may respond later by cutting production.

  - id: services_inflation
    name: Services Inflation
    short_name: Services Inflation
    category: lagging
    subgroup: inflation_rates
    provider: fred
    series_id: CUSR0000SAS
    frequency: monthly
    units: cpi_index
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 0
    exact: true
    description: CPI for services; shown as inflation level and momentum rather than a simple good/bad signal.
    why_it_matters: Services inflation tends to be persistent and can remain elevated after demand has already changed, making it useful for judging late-cycle inflation pressure.

  - id: unit_labor_costs
    name: Manufacturing Unit Labor Costs
    short_name: Unit Labor Costs
    category: lagging
    subgroup: labor
    provider: fred
    series_id: ULCMFG
    frequency: quarterly
    units: index
    monthly_aggregation: carry_forward
    signal_transform: yoy_pct
    direction: 0
    exact: true
    description: Manufacturing sector unit labor costs.
    why_it_matters: Unit labor costs compare worker compensation with output. Rapid increases can signal margin pressure and persistent inflationary pressure after the economy has already strengthened.

  - id: real_ci_loans
    name: Real Commercial and Industrial Loans
    short_name: Real C&I Loans
    category: lagging
    subgroup: credit_inventory
    provider: derived
    frequency: monthly
    units: real_index
    monthly_aggregation: last
    signal_transform: yoy_pct
    direction: 0
    exact: false
    inputs:
      numerator: {provider: fred, series_id: BUSLOANS}
      denominator: {provider: fred, series_id: PCEPI}
    operation: deflate_index
    description: C&I loans deflated by the PCE price index.
    why_it_matters: Commercial and industrial loan growth shows how much bank credit businesses are using. Credit often continues expanding after economic activity has already accelerated, making it lagging.

  - id: consumer_credit_income
    name: Consumer Credit to Personal Income
    short_name: Credit / Income
    category: lagging
    subgroup: credit_inventory
    provider: derived
    frequency: monthly
    units: ratio
    monthly_aggregation: last
    signal_transform: level
    direction: 0
    exact: false
    inputs:
      numerator: {provider: fred, series_id: TOTALSL, unit_scale: 0.001}
      denominator: {provider: fred, series_id: PI, unit_scale: 1}
    operation: ratio
    description: Total consumer credit divided by annualized personal income; public reproducible proxy for installment credit/income.
    why_it_matters: This ratio indicates how large household credit balances are relative to income. Rising leverage can reflect strong prior spending but may also leave consumers more financially constrained.

  - id: prime_rate
    name: Average Prime Rate
    short_name: Prime Rate
    category: lagging
    subgroup: inflation_rates
    provider: fred
    series_id: DPRIME
    frequency: daily
    units: percent
    monthly_aggregation: mean
    signal_transform: level
    direction: 0
    exact: true
    description: Bank prime loan rate, converted to a monthly average.
    why_it_matters: The prime rate follows monetary policy with a lag and affects many borrowing costs. It often remains high after inflation or economic activity has already peaked.
